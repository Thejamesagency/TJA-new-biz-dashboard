<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Bulletin Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════════════════════════
     Team Bulletin Board (Playground project)

     Data never lives in this file (the repo is public). It arrives
     from the parent playground.html via postMessage:
       parent → { type:'pg:data', data, prefs, viewer:{email, canEdit} }
       here   → { type:'pg:ready', key, prefsKey }
                { type:'pg:save',  key, data }        (synced, admin only)
                { type:'pg:prefs', prefsKey, prefs }  (per-device, unsynced)
     data = playground_bulletin = {
       generatedAt, weekStart,
       people: { email: { name?, blocks:[{t:'busy|focus|ooo|email', s:'YYYY-MM-DD HH:MM', e}], with:{email:n} } },
       board:  { email: [{ t:'email|focus|ooo', days:[0-4] | date:'YYYY-MM-DD', s:'HH:MM', e:'HH:MM' }] }
     }
     Calendar blocks are busy/free only — no titles are stored.
     ═══════════════════════════════════════════════════════════════ */
  :root {
    --orange: #FF7800; --orange-soft: rgba(255,120,0,0.14);
    --bg: #161616; --card: #1c1c1c; --card-2: #222; --border: #2a2a2a; --border-strong: #3a3a3a;
    --text: #ececec; --text-2: #a0a0a0; --muted: #6b6b6b;
    --green: #48bb78; --green-soft: rgba(72,187,120,0.14); --green-ink: #9ae6b4;
    --blue: #63b3ed; --purple: #b794f4; --red: #fc8181; --amber: #f6ad55;
    --busy: #3b4350;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; padding: 22px 26px 60px; font-size: 14px; }
  button, select, input { font-family: inherit; }

  .head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .head h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .head .sub { color: var(--text-2); font-size: 13px; margin-top: 4px; }
  .head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 5px 9px; border-radius: 6px; }
  .tag.demo { color: var(--amber); border: 1px dashed rgba(246,173,85,.5); }
  .tag.live { color: var(--green); border: 1px solid rgba(72,187,120,.4); }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .seg button { background: none; border: 0; color: var(--text-2); padding: 6px 11px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .seg button.on { background: var(--orange); color: #111; }
  .sel { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; font-size: 13px; }
  .btn { background: var(--card); color: var(--text); border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 11px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: var(--orange); }
  .btn.primary { background: var(--orange); color: #111; border-color: var(--orange); }
  .lbl { font-size: 12px; color: var(--text-2); font-weight: 600; }
  .spacer { flex: 1; }

  h2.sec { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); font-weight: 800; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h2.sec .count { background: var(--card-2); border: 1px solid var(--border); color: var(--text); border-radius: 99px; padding: 1px 8px; font-size: 11px; }

  /* ─── Hero: checking email now ─── */
  .hero { background: linear-gradient(180deg, rgba(72,187,120,0.07), transparent); border: 1px solid rgba(72,187,120,0.3); border-radius: 14px; padding: 16px; margin-bottom: 18px; }
  .hero h2.sec { color: var(--green); }
  .now-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .now-card { background: var(--card); border: 1px solid rgba(72,187,120,0.35); border-radius: 11px; padding: 11px 12px; display: flex; gap: 10px; align-items: center; }
  .now-card .nm { font-weight: 700; font-size: 14px; }
  .now-card .until { font-size: 12px; color: var(--green-ink); margin-top: 2px; }
  .empty { color: var(--text-2); font-size: 13.5px; line-height: 1.55; }
  .empty b { color: var(--text); }

  .av { width: 34px; height: 34px; border-radius: 50%; background: var(--card-2); border: 1px solid var(--border-strong); display: grid; place-items: center;
    font-size: 12px; font-weight: 800; flex: none; position: relative; color: var(--text); }
  .av .dot { position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--card); }

  .two { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }

  /* ─── Coming up ─── */
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .upnext { display: grid; gap: 2px; }
  .slot { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 7px 4px; border-top: 1px solid #242424; align-items: start; }
  .slot:first-child { border-top: 0; }
  .slot .tm { font-weight: 800; font-size: 13px; color: var(--green-ink); padding-top: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .pchip { background: var(--card-2); border: 1px solid var(--border); border-radius: 99px; padding: 3px 9px 3px 3px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .pchip i { width: 20px; height: 20px; border-radius: 50%; background: #2c2c2c; display: grid; place-items: center; font-style: normal; font-size: 9px; font-weight: 800; }
  .pchip span { color: var(--muted); font-weight: 500; }

  /* ─── People status list ─── */
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
  .pcard { background: var(--card); border: 1px solid var(--border); border-radius: 11px; padding: 11px 12px; }
  .pcard .top { display: flex; gap: 10px; align-items: center; }
  .pcard .nm { font-weight: 700; font-size: 13.5px; }
  .pcard .st { font-size: 12px; color: var(--text-2); margin-top: 1px; }
  .pill { margin-left: auto; font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
  .pill.email { background: var(--green-soft); color: var(--green); }
  .pill.busy { background: rgba(99,179,237,0.13); color: var(--blue); }
  .pill.focus { background: rgba(183,148,244,0.14); color: var(--purple); }
  .pill.ooo { background: rgba(252,129,129,0.13); color: var(--red); }
  .pill.free { background: #2a2a2a; color: var(--text-2); }
  .strip { position: relative; height: 8px; border-radius: 4px; background: #262626; margin: 10px 0 5px; overflow: hidden; }
  .strip div { position: absolute; top: 0; bottom: 0; }
  .strip .busy { background: var(--busy); }
  .strip .focus { background: #6b4a92; }
  .strip .ooo { background: #7a3434; }
  .strip .email { background: var(--green); }
  .strip .nowm { background: var(--orange); width: 2px; }
  .facts { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--muted); }
  .facts b { color: var(--text-2); font-weight: 600; }
  .noemail { color: var(--amber); }

  /* ─── Side panels ─── */
  .side { display: grid; gap: 16px; position: sticky; top: 12px; }
  form.add { display: grid; gap: 9px; }
  form.add .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  form.add label { display: grid; gap: 4px; font-size: 11.5px; color: var(--text-2); font-weight: 600; }
  form.add input[type=time] { background: var(--bg); color: var(--text); border: 1px solid var(--border-strong); border-radius: 7px; padding: 7px 8px; font-size: 13px; }
  .days { display: flex; gap: 5px; }
  .days label { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .days input { display: none; }
  .days span { border: 1px solid var(--border-strong); border-radius: 7px; padding: 6px 0; width: 44px; text-align: center; font-size: 12px; color: var(--text-2); }
  .days input:checked + span { border-color: var(--green); color: var(--green); background: var(--green-soft); }
  .typeseg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .typeseg button { background: var(--bg); border: 1px solid var(--border-strong); color: var(--text-2); border-radius: 7px; padding: 7px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .typeseg button.on.email { border-color: var(--green); color: var(--green); background: var(--green-soft); }
  .typeseg button.on.focus { border-color: var(--purple); color: var(--purple); background: rgba(183,148,244,.12); }
  .mine { display: grid; gap: 5px; margin-top: 4px; }
  .mine div { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; }
  .mine button { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; }
  .note { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .note.warn { color: var(--amber); }

  /* ─── My-people picker ─── */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .overlay.open { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border-strong); border-radius: 14px; width: min(620px, 100%); max-height: 85vh; display: flex; flex-direction: column; }
  .modal .mh { padding: 16px 18px 8px; }
  .modal .mh h3 { font-size: 17px; }
  .modal .mh p { font-size: 12.5px; color: var(--text-2); margin-top: 4px; line-height: 1.5; }
  .modal .mb { padding: 6px 18px; overflow-y: auto; }
  .modal .mf { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  .pick-group { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--orange); font-weight: 800; margin: 12px 0 6px; }
  .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
  .picks label { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; font-size: 13px; cursor: pointer; }
  .picks label:has(input:checked) { border-color: var(--orange); background: var(--orange-soft); }
  .picks small { color: var(--muted); margin-left: auto; font-size: 11px; }

  .gate { max-width: 560px; margin: 60px auto; text-align: center; color: var(--text-2); line-height: 1.6; }
  .gate h2 { color: var(--text); font-size: 20px; margin-bottom: 8px; }

  @media (max-width: 1000px) { .two { grid-template-columns: 1fr; } .side { position: static; } }
  @media (max-width: 600px) { body { padding: 14px 12px 40px; } }
  /* ─── Status columns (v3) ─── */
  .cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  .col { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; border-top: 4px solid #444; min-height: 160px; }
  .col-email { border-top-color: var(--green); background: linear-gradient(180deg, rgba(72,187,120,.08), var(--card) 120px); }
  .col-free { border-top-color: #8fd19e; }
  .col-busy { border-top-color: var(--blue); }
  .col-ooo { border-top-color: var(--red); }
  .col-h { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 15px; }
  .col-h b { font-size: 22px; }
  .col-email .col-h b { color: var(--green); }
  .col-hint { font-size: 11.5px; color: var(--muted); margin: 1px 0 10px; }
  .col-empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
  .chip-p { display: flex; align-items: center; gap: 9px; width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 7px 9px; margin-bottom: 6px;
    color: var(--text); cursor: pointer; text-align: left; font-size: 13.5px; }
  .chip-p:hover, .chip-p.open { border-color: var(--orange); }
  .chip-p .cn { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip-p .cn i { font-style: normal; color: var(--muted); font-weight: 500; }
  .chip-p .cs { font-size: 11.5px; color: var(--text-2); white-space: nowrap; }
  .col-email .chip-p { border-color: rgba(72,187,120,.4); }
  .col-email .chip-p .cs { color: var(--green-ink); }
  .av.sm { width: 26px; height: 26px; font-size: 10px; }
  .detail { max-width: 420px; margin-bottom: 14px; }
  .nextline { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--text-2); padding: 10px 2px; border-top: 1px solid var(--border); }
  .nextline .nx b { color: var(--green-ink); }
  .muted { color: var(--muted); }
  .foot { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 520px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app"><div class="gate"><h2>Loading…</h2></div></div>

<div class="overlay" id="pickOverlay">
  <div class="modal">
    <div class="mh">
      <h3>Who do you work with?</h3>
      <p>Pick the people you want on your board. Suggestions are the people you share the most meetings with this week. Saved on this device only.</p>
    </div>
    <div class="mb" id="pickBody"></div>
    <div class="mf">
      <button class="btn" id="pickNone">Clear</button>
      <span class="spacer"></span>
      <button class="btn" id="pickCancel">Cancel</button>
      <button class="btn primary" id="pickSave">Save my people</button>
    </div>
  </div>
</div>

<script>
var DATA_KEY = 'playground_bulletin';
var PREFS_KEY = 'playground_bulletin_prefs';
var TZ = 'America/Phoenix';
var DAY_START = 8 * 60, DAY_END = 18 * 60;
var DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

var state = {
  data: null, prefs: { me: '', myPeople: [], scope: 'mine' }, viewer: { email: '', canEdit: false },
  mode: 'loading', dayOffset: null, formType: 'email'
};

// ─── Bridge to playground.html ───────────────────────────────────
var inFrame = window.parent && window.parent !== window;
function post(msg) { if (inFrame) window.parent.postMessage(msg, '*'); }
window.addEventListener('message', function (e) {
  if (e.source !== window.parent || !e.data || e.data.type !== 'pg:data') return;
  state.data = e.data.data && e.data.data.people ? e.data.data : null;
  state.prefs = Object.assign({ me: '', myPeople: [], scope: 'mine' }, e.data.prefs || {});
  state.viewer = e.data.viewer || state.viewer;
  if (!state.prefs.me && state.viewer.email && state.data && state.data.people[state.viewer.email]) state.prefs.me = state.viewer.email;
  if (!state.prefs.myPeople.length && state.prefs.me) state.prefs.myPeople = suggest(state.prefs.me).slice(0, 8);
  state.mode = state.data ? 'live' : 'nodata';
  render();
});
post({ type: 'pg:ready', key: DATA_KEY, prefsKey: PREFS_KEY });
setTimeout(function () { if (state.mode === 'loading') { state.mode = 'standalone'; render(); } }, 1500);
function savePrefs() { post({ type: 'pg:prefs', prefsKey: PREFS_KEY, prefs: state.prefs }); }

// ─── Time helpers (everything in Phoenix local time) ─────────────
function phxNow() {
  var p = {}; new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23', weekday: 'short' })
    .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
  return { date: p.year + '-' + p.month + '-' + p.day, min: +p.hour * 60 + +p.minute, dow: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(p.weekday) };
}
function toMin(hm) { var a = hm.split(':'); return +a[0] * 60 + +a[1]; }
function fmt(m) { var h = Math.floor(m / 60), mm = m % 60, ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + (mm ? ':' + String(mm).padStart(2, '0') : '') + ap; }
function addDays(ymd, n) { var d = new Date(ymd + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dowOf(ymd) { return (new Date(ymd + 'T12:00:00Z').getUTCDay() + 6) % 7; }
function niceDate(ymd) { return new Date(ymd + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', timeZone: 'UTC' }); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function ago(iso) { var m = Math.round((Date.now() - Date.parse(iso)) / 60000); if (isNaN(m)) return '—'; if (m < 60) return m + 'm ago'; if (m < 1440) return Math.round(m / 60) + 'h ago'; return Math.round(m / 1440) + 'd ago'; }

// ─── People ──────────────────────────────────────────────────────
function nameOf(email) {
  var p = state.data && state.data.people[email];
  if (p && p.name) return p.name;
  var local = email.split('@')[0];
  if (local === 'cjones') return 'C. Jones';
  return local.charAt(0).toUpperCase() + local.slice(1);
}
function initials(email) { var n = nameOf(email).replace(/\./g, '').split(/\s+/); return (n.length > 1 ? n[0][0] + n[1][0] : n[0].slice(0, 2)).toUpperCase(); }
function allPeople() {
  if (!state.data) return [];
  return Object.keys(state.data.people).filter(function (e) { return !state.data.people[e].error; })
    .sort(function (a, b) { return nameOf(a).localeCompare(nameOf(b)); });
}
function suggest(me) {
  var w = (state.data && state.data.people[me] && state.data.people[me].with) || {};
  var known = allPeople();
  return Object.keys(w).filter(function (e) { return known.indexOf(e) !== -1 && e !== me; })
    .sort(function (a, b) { return w[b] - w[a]; });
}
function scopePeople() {
  var all = allPeople();
  if (state.prefs.scope === 'all' || !state.prefs.myPeople.length) return all;
  return all.filter(function (e) { return state.prefs.myPeople.indexOf(e) !== -1 || e === state.prefs.me; });
}

// ─── Blocks for a person on a date (calendar + board) ────────────
function blocksFor(email, date) {
  var out = [], p = state.data.people[email] || {};
  (p.blocks || []).forEach(function (b) {
    if (b.s.slice(0, 10) !== date) return;
    var s = toMin(b.s.slice(11)), e = b.e.slice(0, 10) === date ? toMin(b.e.slice(11)) : 24 * 60;
    out.push({ t: b.t, s: s, e: e, src: 'calendar' });
  });
  ((state.data.board || {})[email] || []).forEach(function (b, i) {
    var on = b.date ? b.date === date : (b.days || []).indexOf(dowOf(date)) !== -1;
    if (on) out.push({ t: b.t, s: toMin(b.s), e: toMin(b.e), src: 'board', idx: i });
  });
  return out.sort(function (a, b) { return a.s - b.s; });
}
function statusAt(email, date, m) {
  var b = blocksFor(email, date);
  var cover = function (t) { return b.filter(function (x) { return x.t === t && m >= x.s && m < x.e; })[0]; };
  var nextEmail = b.filter(function (x) { return x.t === 'email' && x.s > m; })[0];
  var o = cover('ooo'), em = cover('email'), fo = cover('focus'), bu = cover('busy');
  var st;
  if (o) st = { k: 'ooo', pill: 'Out', line: 'Out of office' + (o.e < DAY_END ? ' until ' + fmt(o.e) : ' today') };
  else if (em) st = { k: 'email', pill: 'Checking email', line: 'In an email window until ' + fmt(em.e) };
  else if (fo) st = { k: 'focus', pill: 'Heads-down', line: 'Focus time until ' + fmt(endOfRun(b, m)) };
  else if (bu) st = { k: 'busy', pill: 'In a meeting', line: 'Busy until ' + fmt(endOfRun(b, m)) };
  else st = { k: 'free', pill: 'Free', line: 'No meetings right now' };
  st.nextEmail = nextEmail ? nextEmail.s : null;
  st.blocks = b;
  return st;
}
// end of back-to-back busy/focus run starting at m
function endOfRun(b, m) {
  var end = m, moved = true;
  while (moved) { moved = false; b.forEach(function (x) { if (x.t !== 'email' && x.s <= end && x.e > end) { end = x.e; moved = true; } }); }
  return end;
}
function freeWindows(b, from) {
  var busy = b.filter(function (x) { return x.t !== 'email'; }).map(function (x) { return [Math.max(x.s, DAY_START), Math.min(x.e, DAY_END)]; })
    .filter(function (x) { return x[1] > x[0]; }).sort(function (a, c) { return a[0] - c[0]; });
  var out = [], cur = Math.max(from, DAY_START);
  busy.forEach(function (x) { if (x[0] - cur >= 30) out.push([cur, x[0]]); cur = Math.max(cur, x[1]); });
  if (DAY_END - cur >= 30) out.push([cur, DAY_END]);
  return out;
}

// ─── Render ──────────────────────────────────────────────────────
function viewDate() {
  var n = phxNow(), base = n.date;
  if (n.dow > 4) base = addDays(base, 7 - n.dow); // weekend → next Monday
  if (state.dayOffset == null) return { date: base, isToday: base === n.date, nowMin: n.min };
  var mon = addDays(base, -dowOf(base)), d = addDays(mon, state.dayOffset);
  return { date: d, isToday: d === n.date, nowMin: n.min };
}

function render() {
  var app = document.getElementById('app');
  if (state.mode === 'loading') return;
  if (state.mode === 'standalone') {
    app.innerHTML = '<div class="gate"><h2>📌 Team Bulletin Board</h2><p>Open this from the <b>Playground</b> page on the dashboard while signed in with your @thejamesagency.com account. Calendar data is only loaded there, never on this public page.</p>' +
      '<p style="margin-top:14px"><button class="btn" id="demoBtn">Preview with sample data</button></p></div>';
    document.getElementById('demoBtn').onclick = function () { loadDemo(); };
    return;
  }
  if (state.mode === 'nodata') {
    app.innerHTML = '<div class="gate"><h2>📌 Team Bulletin Board</h2><p>No calendar snapshot has been loaded yet. Once calendars are synced, everyone\'s availability will show up here.</p>' +
      '<div style="text-align:left;margin-top:16px">' + importPanel() + '</div></div>';
    wireImport();
    return;
  }

  var v = viewDate(), m = v.isToday ? v.nowMin : DAY_START;
  var people = scopePeople();
  var statuses = {}; people.forEach(function (e) { statuses[e] = statusAt(e, v.date, m); });
  var mon = addDays(v.date, -dowOf(v.date));
  var todayIdx = dowOf(phxNow().date);

  var html = '';
  var scoped = state.prefs.scope !== 'all' && state.prefs.myPeople.length;
  // Header — one line: what moment are we looking at
  html += '<div class="head"><div><h1>' + (v.isToday ? 'Who\'s available now' : 'Who\'s available · ' + DOW[dowOf(v.date)] + ' morning') + '</h1>' +
    '<div class="sub">' + niceDate(v.date) + (v.isToday ? ' · ' + fmt(v.nowMin) : ' · as of 8am') + '</div></div>' +
    '<div class="right">' + (state.mode === 'demo' ? '<span class="tag demo">Sample data</span>' : '') + '</div></div>';

  // Controls
  html += '<div class="controls"><div class="seg" id="days">' + DOW.map(function (d, i) {
    var date = addDays(mon, i);
    return '<button data-i="' + i + '" class="' + (date === v.date ? 'on' : '') + '">' + (date === phxNow().date ? 'Today' : d) + '</button>';
  }).join('') + '</div>';
  html += '<div class="seg" id="scope"><button data-s="mine" class="' + (state.prefs.scope !== 'all' ? 'on' : '') + '">My people</button>' +
    '<button data-s="all" class="' + (state.prefs.scope === 'all' ? 'on' : '') + '">Everyone</button></div>' +
    '<button class="btn" id="editPeople">✎ Edit my people</button><span class="spacer"></span>' +
    '<button class="btn" id="toolsBtn">' + (state.showTools ? '✕ Close' : '📬 Set my email windows') + '</button></div>';
  if (state.prefs.scope !== 'all' && !state.prefs.myPeople.length) html += '<div class="note" style="margin:-8px 0 12px">Showing everyone — click <b>Edit my people</b> to narrow it to the people you work with.</div>';
  if (state.showTools) html += '<div class="tools">' + sidePanel(v) + '</div>';

  // Four columns: the whole answer at a glance
  var COLS = [
    { k: 'email', title: 'Checking email', icon: '📬', hint: 'Good time to send' },
    { k: 'free',  title: 'Free',           icon: '✅', hint: 'Not in a meeting' },
    { k: 'busy',  title: 'Busy',           icon: '⏳', hint: 'Meeting or focus time' },
    { k: 'ooo',   title: 'Out',            icon: '🌴', hint: 'Out of office' }
  ];
  var groups = { email: [], free: [], busy: [], ooo: [] };
  people.forEach(function (e) { var k = statuses[e].k; groups[k === 'focus' ? 'busy' : k].push(e); });
  html += '<div class="cols">' + COLS.map(function (c) {
    var list = groups[c.k].sort(function (a, b) { return nameOf(a).localeCompare(nameOf(b)); });
    return '<div class="col col-' + c.k + '"><div class="col-h"><span>' + c.icon + ' ' + c.title + '</span><b>' + list.length + '</b></div>' +
      '<div class="col-hint">' + c.hint + '</div>' +
      (list.length ? list.map(function (e) { return chip(e, statuses[e], m); }).join('') : '<div class="col-empty">' + (c.k === 'email' ? 'Nobody right now' : '—') + '</div>') + '</div>';
  }).join('') + '</div>';

  // Detail for a clicked person
  if (state.openPerson && statuses[state.openPerson]) html += '<div class="detail">' + personCard(state.openPerson, statuses[state.openPerson], m, v) + '</div>';

  // One line: next email checks
  var next = [];
  people.forEach(function (e) { statuses[e].blocks.forEach(function (b) { if (b.t === 'email' && b.s > m) next.push({ e: e, s: b.s }); }); });
  next.sort(function (a, b) { return a.s - b.s; });
  html += '<div class="nextline"><span class="lbl">Next email checks' + (v.isToday ? ' today' : '') + ':</span> ' +
    (next.length ? next.slice(0, 8).map(function (x) { return '<span class="nx"><b>' + fmt(x.s) + '</b> ' + esc(nameOf(x.e)) + '</span>'; }).join('') + (next.length > 8 ? '<span class="nx">+' + (next.length - 8) + ' more</span>' : '')
      : '<span class="muted">none scheduled' + (scoped ? ' for your people' : '') + '</span>') + '</div>';
  html += '<div class="foot">' + allPeople().length + ' calendars · synced ' + ago(state.data.generatedAt) + ' · busy/free only, no meeting details</div>';
  app.innerHTML = html;
  wire();
}

function chip(e, st, m) {
  var sub = '';
  if (st.k === 'email') sub = 'until ' + fmt(st.blocks.filter(function (x) { return x.t === 'email' && m >= x.s && m < x.e; })[0].e);
  else if (st.k === 'free') sub = st.nextEmail != null ? 'email at ' + fmt(st.nextEmail) : '';
  else if (st.k === 'ooo') sub = st.line.replace('Out of office ', '');
  else sub = 'free at ' + fmt(endOfRun(st.blocks, m));
  return '<button class="chip-p' + (state.openPerson === e ? ' open' : '') + '" data-p="' + esc(e) + '"><span class="av sm">' + initials(e) + '</span>' +
    '<span class="cn">' + esc(nameOf(e)) + (e === state.prefs.me ? ' <i>(you)</i>' : '') + '</span>' + (sub ? '<span class="cs">' + esc(sub) + '</span>' : '') + '</button>';
}
function pct(x) { return ((Math.min(Math.max(x, DAY_START), DAY_END) - DAY_START) / (DAY_END - DAY_START)) * 100; }
function personCard(e, st, m, v) {
  var strip = st.blocks.map(function (b) {
    var l = pct(b.s), w = pct(b.e) - l; if (w <= 0) return '';
    return '<div class="' + b.t + '" style="left:' + l + '%;width:' + w + '%"></div>';
  }).join('') + (v.isToday ? '<div class="nowm" style="left:' + pct(m) + '%"></div>' : '');
  var free = freeWindows(st.blocks, m).slice(0, 2).map(function (w) { return fmt(w[0]) + '–' + fmt(w[1]); }).join(', ');
  var hasEmail = st.blocks.some(function (b) { return b.t === 'email'; });
  var emailTxt = st.nextEmail != null ? 'Next email check <b>' + fmt(st.nextEmail) + '</b>' : (hasEmail ? 'No more email checks' : '<span class="noemail">No email windows set</span>');
  return '<div class="pcard"><div class="top"><div class="av">' + initials(e) + '<span class="dot" style="background:' + dotColor(st.k) + '"></span></div>' +
    '<div><div class="nm">' + esc(nameOf(e)) + (e === state.prefs.me ? ' <span style="color:var(--muted);font-weight:500">(you)</span>' : '') + '</div><div class="st">' + esc(st.line) + '</div></div>' +
    '<span class="pill ' + st.k + '">' + st.pill + '</span></div>' +
    '<div class="strip">' + strip + '</div>' +
    '<div class="facts"><span>' + emailTxt + '</span><span>' + (free ? 'Free <b>' + free + '</b>' : 'No free time left') + '</span></div></div>';
}
function dotColor(k) { return { email: 'var(--green)', busy: 'var(--blue)', focus: 'var(--purple)', ooo: 'var(--red)', free: '#555' }[k]; }

function sidePanel(v) {
  var me = state.prefs.me;
  var html = '<div class="panel"><h2 class="sec">Set my email windows</h2>';
  if (!me) return html + '<div class="note">Click <b>Edit my people</b> and pick yourself first.</div></div>';
  var mine = ((state.data.board || {})[me] || []);
  html += '<form class="add" id="addForm">' +
    '<div class="typeseg"><button type="button" data-t="email" class="email' + (state.formType === 'email' ? ' on' : '') + '">📬 Email check</button>' +
    '<button type="button" data-t="focus" class="focus' + (state.formType === 'focus' ? ' on' : '') + '">🎧 Focus / blackout</button></div>' +
    '<div class="days">' + DOW.map(function (d, i) { return '<label><input type="checkbox" value="' + i + '" checked><span>' + d + '</span></label>'; }).join('') + '</div>' +
    '<div class="row2"><label>From<input type="time" id="fS" value="09:00" step="900"></label><label>To<input type="time" id="fE" value="09:30" step="900"></label></div>' +
    '<button class="btn primary" type="submit">Add to ' + esc(nameOf(me)) + '\'s week</button></form>';
  if (mine.length) html += '<div class="mine">' + mine.map(function (b, i) {
    return '<div>' + (b.t === 'email' ? '📬' : '🎧') + ' ' + fmt(toMin(b.s)) + '–' + fmt(toMin(b.e)) + ' · ' + (b.days ? b.days.map(function (d) { return DOW[d]; }).join(' ') : b.date) +
      '<button data-del="' + i + '" title="Remove">×</button></div>';
  }).join('') + '</div>';
  html += '<p class="note" style="margin-top:8px">Or add a calendar event with “email” in the title (e.g. “Check email”) — it’s picked up on the next sync.</p>';
  if (!state.viewer.canEdit && state.mode !== 'demo') html += '<p class="note warn" style="margin-top:6px">Saving is admin-only on this dashboard right now, so changes here won’t stick for you yet.</p>';
  return html + '</div>' + importPanel();
}
function importPanel() {
  if (!state.viewer.canEdit || state.mode === 'demo') return '';
  return '<div class="panel"><h2 class="sec">Calendar sync (admin)</h2>' +
    '<p class="note" style="margin-bottom:8px">' + (state.data ? 'Last snapshot ' + ago(state.data.generatedAt) + ' · ' + allPeople().length + ' calendars.' : 'No snapshot loaded yet.') +
    ' Load a new busy/free snapshot (.json). Email windows people set on the board are kept.</p>' +
    '<label class="btn" style="display:inline-block">Load calendar snapshot<input type="file" accept=".json,application/json" id="snapFile" hidden></label></div>';
}
function loadSnapshot(file) {
  var r = new FileReader();
  r.onload = function () {
    try {
      var snap = JSON.parse(r.result);
      if (!snap || !snap.people || typeof snap.people !== 'object') throw new Error('missing "people"');
      snap.board = (state.data && state.data.board) || snap.board || {};
      state.data = snap; state.mode = 'live';
      post({ type: 'pg:save', key: DATA_KEY, data: snap });
      render();
    } catch (err) { alert('That file isn\'t a calendar snapshot: ' + err.message); }
  };
  r.readAsText(file);
}

function wire() {
  document.querySelectorAll('#days button').forEach(function (b) { b.onclick = function () { state.dayOffset = +b.dataset.i; render(); }; });
  document.querySelectorAll('#scope button').forEach(function (b) { b.onclick = function () { state.prefs.scope = b.dataset.s; savePrefs(); render(); }; });
  document.getElementById('editPeople').onclick = openPicker;
  document.getElementById('toolsBtn').onclick = function () { state.showTools = !state.showTools; render(); };
  document.querySelectorAll('.chip-p').forEach(function (b) {
    b.onclick = function () { state.openPerson = state.openPerson === b.dataset.p ? null : b.dataset.p; render(); };
  });
  wireImport();
  var f = document.getElementById('addForm');
  if (f) {
    f.querySelectorAll('.typeseg button').forEach(function (b) { b.onclick = function () { state.formType = b.dataset.t; render(); }; });
    f.onsubmit = function (ev) {
      ev.preventDefault();
      var s = document.getElementById('fS').value, e = document.getElementById('fE').value;
      var days = Array.prototype.map.call(f.querySelectorAll('.days input:checked'), function (x) { return +x.value; });
      if (!days.length || toMin(e) <= toMin(s)) { alert('Pick at least one day and an end time after the start.'); return; }
      mutateBoard(function (list) { list.push({ t: state.formType, days: days, s: s, e: e }); });
    };
    document.querySelectorAll('.mine [data-del]').forEach(function (b) {
      b.onclick = function () { var i = +b.dataset.del; mutateBoard(function (list) { list.splice(i, 1); }); };
    });
  }
}
function wireImport() {
  var f = document.getElementById('snapFile');
  if (f) f.onchange = function () { if (f.files[0]) loadSnapshot(f.files[0]); };
}
function mutateBoard(fn) {
  var me = state.prefs.me;
  state.data.board = state.data.board || {};
  state.data.board[me] = state.data.board[me] || [];
  fn(state.data.board[me]);
  if (state.mode !== 'demo') post({ type: 'pg:save', key: DATA_KEY, data: state.data });
  render();
}

// ─── My-people picker ────────────────────────────────────────────
function openPicker() {
  var me = state.prefs.me, sug = me ? suggest(me) : [], w = me ? (state.data.people[me].with || {}) : {};
  var rest = allPeople().filter(function (e) { return e !== me && sug.indexOf(e) === -1; });
  var box = function (e) {
    return '<label><input type="checkbox" value="' + esc(e) + '"' + (state.prefs.myPeople.indexOf(e) !== -1 ? ' checked' : '') + '> ' + esc(nameOf(e)) +
      (w[e] ? '<small>' + w[e] + ' mtg' + (w[e] > 1 ? 's' : '') + '</small>' : '') + '</label>';
  };
  document.getElementById('pickBody').innerHTML =
    '<label class="lbl" style="display:flex;gap:8px;align-items:center;margin-top:4px">I am <select class="sel" id="meSel"><option value="">— pick yourself —</option>' +
      allPeople().map(function (e) { return '<option value="' + esc(e) + '"' + (e === me ? ' selected' : '') + '>' + esc(nameOf(e)) + '</option>'; }).join('') + '</select></label>' +
    (sug.length ? '<div class="pick-group">You meet with most this week</div><div class="picks">' + sug.map(box).join('') + '</div>' : (me ? '' : '<p class="note">Tip: pick yourself in “I am” to get suggestions.</p>')) +
    '<div class="pick-group">Everyone else</div><div class="picks">' + rest.map(box).join('') + '</div>';
  document.getElementById('pickOverlay').classList.add('open');
  document.getElementById('meSel').onchange = function (e) {
    state.prefs.me = e.target.value;
    var keep = Array.prototype.map.call(document.querySelectorAll('#pickBody .picks input:checked'), function (x) { return x.value; });
    if (!keep.length && state.prefs.me) state.prefs.myPeople = suggest(state.prefs.me).slice(0, 8);
    savePrefs(); openPicker();
  };
}
document.getElementById('pickCancel').onclick = function () { document.getElementById('pickOverlay').classList.remove('open'); };
document.getElementById('pickNone').onclick = function () { document.querySelectorAll('#pickBody .picks input').forEach(function (x) { x.checked = false; }); };
document.getElementById('pickSave').onclick = function () {
  state.prefs.myPeople = Array.prototype.map.call(document.querySelectorAll('#pickBody .picks input:checked'), function (x) { return x.value; });
  state.prefs.scope = 'mine';
  savePrefs();
  document.getElementById('pickOverlay').classList.remove('open');
  render();
};

// ─── Sample data (public preview only — fictional people) ────────
function loadDemo() {
  var n = phxNow(), mon = addDays(n.dow > 4 ? addDays(n.date, 7 - n.dow) : n.date, -Math.min(n.dow, 4) + (n.dow > 4 ? 0 : 0));
  mon = addDays(n.date, -(n.dow > 4 ? n.dow - 7 : n.dow));
  var names = ['Avery Park', 'Blake Rivera', 'Casey Lin', 'Devon Shaw', 'Emery Cole', 'Finley Moss', 'Gray Patel', 'Harper Diaz'];
  var people = {};
  names.forEach(function (nm, i) {
    var em = nm.split(' ')[0].toLowerCase() + '@example.com', blocks = [];
    for (var d = 0; d < 5; d++) {
      var date = addDays(mon, d), r = function (k) { var x = Math.sin(i * 31 + d * 7 + k) * 1e4; return x - Math.floor(x); };
      for (var k = 0; k < 3; k++) { var s = 9 * 60 + Math.floor(r(k) * 16) * 30; blocks.push({ t: 'busy', s: date + ' ' + hm(s), e: date + ' ' + hm(s + (r(k + 9) > .5 ? 60 : 30)) }); }
      if (i % 3 === 0) blocks.push({ t: 'focus', s: date + ' 13:00', e: date + ' 15:00' });
      if (i === 5 && d === 4) blocks.push({ t: 'ooo', s: date + ' 08:00', e: date + ' 18:00' });
      if (i % 2 === 0) blocks.push({ t: 'email', s: date + ' ' + hm(8 * 60 + 30 + i * 15), e: date + ' ' + hm(9 * 60 + i * 15) });
    }
    var with_ = {}; names.forEach(function (o, j) { if (j !== i) with_[o.split(' ')[0].toLowerCase() + '@example.com'] = (i + j) % 5; });
    people[em] = { name: nm, blocks: blocks, with: with_ };
  });
  var board = {}; board['blake@example.com'] = [{ t: 'email', days: [0, 1, 2, 3, 4], s: hm(Math.max(DAY_START, Math.floor(n.min / 30) * 30)), e: hm(Math.max(DAY_START, Math.floor(n.min / 30) * 30) + 30) }, { t: 'email', days: [0, 1, 2, 3, 4], s: '16:00', e: '16:30' }];
  state.data = { generatedAt: new Date().toISOString(), people: people, board: board };
  state.prefs = { me: 'avery@example.com', myPeople: ['blake@example.com', 'casey@example.com', 'emery@example.com', 'gray@example.com'], scope: 'mine' };
  state.viewer = { email: '', canEdit: true };
  state.mode = 'demo';
  render();
}
function hm(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }

setInterval(function () { if (state.mode === 'live' || state.mode === 'demo') render(); }, 60000);
</script>
</body>
