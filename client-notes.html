<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TJA Client Notes</title>
<script type="module" src="firebase-sync.js?v=29"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #FF7800; --accent-light: #ff9533; --accent-mid: #f68e21; --accent-deep: #cc6000;
    --accent-bg: #2a1700; --accent-bg2: #3a2d20; --accent-rgb: 255,120,0;
    --orange: var(--accent); --orange-light: var(--accent-light); --orange-deep: var(--accent-deep);
    --orange-bg: var(--accent-bg); --teal: var(--accent-deep);
    --bg: #161616; --bg-2: #1a1a1a; --nav-bg: #0a0a0a; --surface: #1e1e1e; --card: #222222; --hover: #2a2a2a;
    --border: #2a2a2a; --border-strong: #3a3a3a; --line: #555555;
    --text: #ececec; --text-secondary: #a0a0a0; --text-muted: #6b6b6b; --strong: #ffffff; --ink: #000000;
    --black: var(--ink); --white: var(--text); --gray: var(--text-secondary); --red: #e53e3e;
  }
  /*!THEME-BOUNDARY!*/
html { font-size: 120%; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh;  padding-left: 190px; /* fixed sidebar */ }

/* ─── SIDEBAR NAV (global — 8 tabs; brand stripe on the left edge) ─── */
.nav {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 190px;
  z-index: 5000;
  background: var(--nav-bg);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 0;
  border-left: 3px solid var(--accent);
  border-right: 1px solid var(--surface);
  box-shadow: 4px 0 20px rgba(0,0,0,0.4);
  overflow-y: auto;
}
.nav a {
  position: relative;
  padding: 0.62rem 1.05rem;
  display: flex;
  align-items: center;
  text-decoration: none;
  color: var(--text-muted);
  font-size: 0.6rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  transition: color 0.2s ease, background 0.2s ease;
}
.nav a::before {
  content: "";
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: transparent;
  margin-right: 9px;
  flex-shrink: 0;
  transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
}
.nav a:hover { color: var(--strong); background: rgba(255,255,255,0.025); }
.nav a.active { color: var(--accent); background: rgba(var(--accent-rgb),0.07); }
.nav a.active::before { background: var(--accent); box-shadow: 0 0 12px rgba(var(--accent-rgb),0.85); transform: scale(1.15); }
.nav-logo { height: 28px; margin: 16px auto 14px; flex-shrink: 0; opacity: 0.95; align-self: center; }
.nav-date { margin-top: auto; padding: 0.8rem 1.05rem 0.35rem; font-size: 0.6rem; font-weight: 400; color: var(--text-muted); letter-spacing: 0.01em; }
.auth-bar { padding: 0.3rem 1.05rem 1rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; min-height: 32px; }
.auth-status { font-size: 0.58rem; color: var(--text-secondary); letter-spacing: 0.02em; word-break: break-word; }
.auth-status-local { color: var(--accent-light); }
.auth-btn { padding: 0.32rem 0.75rem; font-size: 0.6rem; border: 1px solid var(--border-strong); background: transparent; color: var(--text-secondary); border-radius: 5px; cursor: pointer; font-family: inherit; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; transition: all 0.15s ease; }
.auth-btn:hover { background: var(--surface); color: var(--strong); border-color: var(--line); }
.auth-btn.auth-btn-primary { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700; }
.auth-btn.auth-btn-primary:hover { background: var(--accent-light); border-color: var(--accent-light); color: var(--ink); }
/* Sidebar collapses to a sticky top bar on phones */
@media (max-width: 720px) {
  body { padding-left: 0; }
  .nav {
    position: sticky;
    top: 0; bottom: auto;
    width: 100%;
    height: auto;
    flex-direction: row;
    align-items: center;
    overflow-x: auto;
    overflow-y: hidden;
    border-left: none;
    border-right: none;
    border-top: 3px solid var(--accent);
    border-bottom: 1px solid var(--surface);
  }
  .nav a { padding: 0.5rem 0.55rem; font-size: 0.55rem; letter-spacing: 0.1em; white-space: nowrap; }
  .nav-logo { height: 24px; margin: 0 8px 0 10px; }
  .nav-date { display: none; }
  .auth-bar { margin-left: auto; padding: 0.3rem 0.6rem; flex-wrap: nowrap; min-height: 0; }
  .auth-status { white-space: nowrap; }
}

/* ─── TOOLBAR ─── */
.toolbar {
  padding: 0.75rem 1.5rem; display: flex; gap: 0.5rem; align-items: center;
  background: var(--bg); border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.toolbar input[type="text"] {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 0.45rem 0.8rem; border-radius: 6px; font-size: 0.75rem;
  width: 280px; outline: none; font-family: inherit;
  transition: border-color 0.15s ease;
}
.toolbar input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.08); }
.toolbar .count {
  margin-left: auto; font-size: 0.7rem; color: var(--text-muted);
}

/* ─── GROUP TABS ─── */
.group-tabs {
  display: flex; align-items: stretch; gap: 0;
  background: var(--bg); border-bottom: 1px solid var(--border);
  padding: 0 1.5rem; overflow-x: auto;
}
.group-tab {
  padding: 0.7rem 1.1rem; background: none; border: none;
  color: var(--text-muted); font-family: inherit; font-size: 0.72rem;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  cursor: pointer; border-bottom: 2px solid transparent;
  white-space: nowrap; display: flex; align-items: center; gap: 8px;
  transition: color 0.15s, border-color 0.15s;
}
.group-tab:hover { color: var(--text-secondary); }
.group-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.group-tab-count {
  background: var(--border); color: var(--text-secondary);
  padding: 1px 7px; border-radius: 10px;
  font-size: 0.6rem; font-weight: 700;
}
.group-tab.active .group-tab-count { background: var(--accent-bg2); color: var(--accent); }
/* Tab auto-hides when its bucket has zero clients (e.g. Unsorted
   disappears once everything is categorized). */
.group-tab.hidden { display: none; }
/* While dragging a card, highlight the tabs as drop targets. */
.group-tab.drag-over {
  background: var(--hover);
  color: var(--accent);
  border-bottom-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

/* ─── GROUP BADGES (on cards + in modal) ─── */
.group-badge {
  display: inline-block;
  font-size: 0.55rem; font-weight: 700;
  padding: 2px 7px; border-radius: 3px;
  text-transform: uppercase; letter-spacing: 0.06em;
  white-space: nowrap;
}
.group-badge.current   { background: #1e3a2f; color: #68d391; }
.group-badge.won       { background: #2d2040; color: #d6bcfa; }
.group-badge.past      { background: var(--accent-bg2); color: var(--accent-light); }
.group-badge.unsorted  { background: var(--border); color: var(--text-muted); }

/* ─── CLIENT GRID ─── */
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 0.75rem; padding: 1rem 1.5rem;
}
.client-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 0.85rem 1rem; cursor: pointer;
  transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
  display: flex; flex-direction: column; gap: 0.5rem;
  min-height: 130px;
}
.client-card:hover {
  border-color: var(--accent);
  background: #211810;
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(0,0,0,0.4), 0 0 0 1px rgba(var(--accent-rgb),0.15);
}
.client-card.has-notes { border-left: 3px solid var(--accent); }
.client-card.dragging { opacity: 0.35; cursor: grabbing; }
.client-card[draggable="true"] { cursor: grab; }
.client-card[draggable="true"]:active { cursor: grabbing; }
.client-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.4rem; }
.client-name { font-weight: 700; font-size: 0.85rem; color: var(--text); word-break: break-word; flex: 1; }
.client-card-convo {
  display: inline-block;
  text-decoration: none;
  font-size: 0.85rem;
  line-height: 1;
  padding: 2px 5px;
  border-radius: 4px;
  opacity: 0.65;
  flex-shrink: 0;
  transition: background 0.15s, opacity 0.15s;
}
.client-card-convo:hover { background: rgba(99,179,237,0.14); opacity: 1; }
.client-task-count {
  font-size: 0.55rem; color: var(--text-muted); background: var(--border);
  padding: 1px 6px; border-radius: 3px; white-space: nowrap;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.client-notes-preview {
  font-size: 0.72rem; color: var(--text-secondary); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
  overflow: hidden; flex: 1;
}
.client-notes-preview.empty { color: var(--line); font-style: italic; }
.client-meta {
  font-size: 0.55rem; color: var(--text-muted); margin-top: auto;
}

/* ─── MODAL ─── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 10000; align-items: center; justify-content: center; padding: 1rem;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: 10px;
  width: 100%; max-width: 640px; max-height: 90vh; display: flex; flex-direction: column;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--border);
}
.modal-header h2 { font-size: 1rem; color: var(--accent); font-weight: 700; }
.modal-close {
  background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer;
  padding: 0 4px; line-height: 1;
}
.modal-close:hover { color: var(--strong); }
.modal-body { padding: 0.9rem 1.1rem; flex: 1; overflow-y: auto; }
.group-picker {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 0.85rem;
}
.group-picker-label {
  width: 100%; font-size: 0.6rem; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
  margin-bottom: 2px;
}
.group-pick {
  background: var(--hover); border: 1px solid var(--border); color: var(--text-secondary);
  padding: 5px 11px; border-radius: 4px;
  font-size: 0.7rem; font-weight: 600; cursor: pointer;
  font-family: inherit; transition: all 0.15s;
}
.group-pick:hover { border-color: var(--line); color: var(--strong); }
.group-pick.selected {
  background: var(--accent-bg2); border-color: var(--accent); color: var(--accent);
}
.modal-body textarea {
  width: 100%; min-height: 320px; resize: vertical;
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 0.7rem 0.85rem; border-radius: 6px;
  font-family: 'Inter', sans-serif; font-size: 0.85rem; line-height: 1.5;
  outline: none;
}
.modal-body textarea:focus { border-color: var(--accent); }
.modal-footer {
  display: flex; gap: 0.5rem; justify-content: flex-end;
  padding: 0.75rem 1.1rem; border-top: 1px solid var(--border);
}
.modal-footer button {
  padding: 0.55rem 1.1rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600;
  cursor: pointer; font-family: inherit; border: 1px solid var(--border-strong);
  background: transparent; color: var(--text-secondary);
}
.modal-footer button:hover { background: var(--border); color: var(--strong); }
.modal-footer button.primary {
  background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700;
}
.modal-footer button.primary:hover { background: var(--accent-deep); }
.modal-footer button.danger {
  border-color: #5a2020; color: #fc8181;
}
.modal-footer button.danger:hover { background: #3a1818; color: #fc8181; }

.empty-state {
  padding: 4rem 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.85rem;
}
.empty-state .hint { font-size: 0.7rem; color: var(--line); margin-top: 0.4rem; }

@media (max-width: 780px) {
  body { padding: 0; }
  .toolbar { padding: 0.5rem; flex-wrap: wrap; }
  .toolbar input[type="text"] { width: 100%; font-size: 16px; }
  .grid { grid-template-columns: 1fr; padding: 0.5rem; gap: 0.5rem; }
  .modal { max-height: calc(100vh - 1rem); }
  .modal-body textarea { font-size: 16px; min-height: 240px; }
}
</style>
</head>
<body>

<nav class="nav">
  <img class="nav-logo" src="https://thejamesagency.com/wp-content/uploads/2025/04/TJA-primary-logo.svg" alt="TJA" onerror="this.style.display='none'">
  <a href="task-list.html">Status Report</a>
  <a href="weekly-priorities.html">Weekly Priorities</a>

</nav>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="Search clients or notes...">
  <div class="count" id="rowCount">0 clients</div>
</div>

<div class="group-tabs" id="groupTabs">
  <button class="group-tab active" data-group="current" type="button">Current <span class="group-tab-count" data-count="current">0</span></button>
  <button class="group-tab" data-group="won" type="button">Won <span class="group-tab-count" data-count="won">0</span></button>
  <button class="group-tab" data-group="past" type="button">Past Opportunities <span class="group-tab-count" data-count="past">0</span></button>
  <button class="group-tab" data-group="unsorted" type="button">Unsorted <span class="group-tab-count" data-count="unsorted">0</span></button>
</div>

<div id="grid" class="grid"></div>

<!-- Edit modal (same modal pattern used on task-list.html) -->
<div class="modal-overlay" id="clientNotesModal"
     onmousedown="this._mdSelf=(event.target===this)"
     onclick="if(event.target===this&&this._mdSelf)closeClientNotesModal();this._mdSelf=false">
  <div class="modal">
    <div class="modal-header">
      <h2 id="clientNotesTitle">Client</h2>
      <button class="modal-close" onclick="closeClientNotesModal()" type="button">&times;</button>
    </div>
    <div class="modal-body">
      <div class="group-picker" id="modalGroupPicker">
        <div class="group-picker-label">Group</div>
        <button class="group-pick" data-group="current" type="button">Current</button>
        <button class="group-pick" data-group="won" type="button">Won</button>
        <button class="group-pick" data-group="past" type="button">Past Opportunity</button>
        <button class="group-pick" data-group="unsorted" type="button">Unsorted</button>
      </div>
      <textarea id="clientNotesTextarea" placeholder="Notes about this client — context, decision makers, history, gotchas…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="danger" onclick="clearClientNotes()" type="button">Delete notes</button>
      <button onclick="closeClientNotesModal()" type="button">Cancel</button>
      <button class="primary" onclick="saveClientNotes()" type="button">Save</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   Client Notes — keyed by client name, lives in localStorage
   under 'client_notes' which is in SYNC_KEYS so it round-trips
   through Firestore like the rest of the data.
   ════════════════════════════════════════════════════════════ */
document.getElementById("headerDate").textContent =
  new Date().toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });

let _editingClient = null;
let _editingGroup = "unsorted";
let _searchQuery = "";
let _activeTab = (function () {
  try { return localStorage.getItem('cn_active_tab') || 'current'; } catch { return 'current'; }
})();

const GROUP_LABELS = {
  current:  "Current",
  won:      "Won",
  past:     "Past Opportunity",
  unsorted: "Unsorted"
};
const GROUP_KEYS = ["current", "won", "past", "unsorted"];

function escH(s) {
  return String(s == null ? "" : s)
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;").replaceAll('"', "&quot;");
}

function loadAllClientNotes() {
  try { return JSON.parse(localStorage.getItem('client_notes') || '{}') || {}; }
  catch { return {}; }
}
function saveAllClientNotes(notes) {
  localStorage.setItem('client_notes', JSON.stringify(notes));
}
function getClientNotes(clientName) {
  return loadAllClientNotes()[clientName] || "";
}

function loadAllClientGroups() {
  try { return JSON.parse(localStorage.getItem('client_groups') || '{}') || {}; }
  catch { return {}; }
}
function saveAllClientGroups(groups) {
  localStorage.setItem('client_groups', JSON.stringify(groups));
}
function loadHiddenSet() {
  try {
    const arr = JSON.parse(localStorage.getItem('client_notes_hidden') || '[]');
    return new Set(Array.isArray(arr) ? arr : []);
  } catch { return new Set(); }
}
function saveHiddenSet(set) {
  localStorage.setItem('client_notes_hidden', JSON.stringify(Array.from(set)));
}
function isClientHidden(name) {
  return loadHiddenSet().has(name);
}
function setClientHidden(name, hidden) {
  if (!name) return;
  const s = loadHiddenSet();
  if (hidden) s.add(name); else s.delete(name);
  saveHiddenSet(s);
}
function getClientGroup(clientName) {
  const g = loadAllClientGroups()[clientName];
  if (GROUP_KEYS.indexOf(g) >= 0) return g;
  // No explicit assignment — derive a sensible default from the
  // client's SR task state: active = Current, archive-only = Past,
  // notes-only = Unsorted. New SR tasks therefore land in Current
  // automatically, exactly as the user expects.
  return _defaultGroupForClient(clientName);
}

function _defaultGroupForClient(name) {
  if (!name) return "unsorted";
  let hasActive = false, hasArchived = false;
  try {
    const active = JSON.parse(localStorage.getItem('sr_tasks') || '[]');
    if (Array.isArray(active)) {
      for (const t of active) {
        if (t && t.client && String(t.client).trim() === name) { hasActive = true; break; }
      }
    }
  } catch (e) {}
  if (!hasActive) {
    try {
      const arch = JSON.parse(localStorage.getItem('sr_archived_tasks') || '[]');
      if (Array.isArray(arch)) {
        for (const t of arch) {
          if (t && t.client && String(t.client).trim() === name) { hasArchived = true; break; }
        }
      }
    } catch (e) {}
  }
  if (hasActive) return "current";
  if (hasArchived) return "past";
  return "unsorted";
}
function setClientGroup(clientName, group) {
  if (!clientName) return;
  if (GROUP_KEYS.indexOf(group) < 0) group = "unsorted";
  const all = loadAllClientGroups();
  all[clientName] = group;
  saveAllClientGroups(all);
}

function loadAllClients() {
  // Union of every client name across active + archived SR tasks,
  // plus any clients that have notes or group assignments but no
  // tasks (so deleting all tasks doesn't orphan them).
  const set = new Map(); // name → task count
  function ingest(arr) {
    if (!Array.isArray(arr)) return;
    arr.forEach(t => {
      const name = (t && t.client && String(t.client).trim()) || "";
      if (!name) return;
      set.set(name, (set.get(name) || 0) + 1);
    });
  }
  try { ingest(JSON.parse(localStorage.getItem('sr_tasks') || '[]')); } catch {}
  try { ingest(JSON.parse(localStorage.getItem('sr_archived_tasks') || '[]')); } catch {}
  const notes = loadAllClientNotes();
  const groups = loadAllClientGroups();
  Object.keys(notes).forEach(name => { if (!set.has(name)) set.set(name, 0); });
  Object.keys(groups).forEach(name => { if (!set.has(name)) set.set(name, 0); });
  const hidden = loadHiddenSet();
  return Array.from(set.entries())
    .filter(([name]) => !hidden.has(name))
    .map(([name, count]) => ({
      name,
      count,
      notes: notes[name] || "",
      group: GROUP_KEYS.indexOf(groups[name]) >= 0 ? groups[name] : _defaultGroupForClient(name)
    }))
    .sort((a, b) => a.name.localeCompare(b.name));
}

function render() {
  const clients = loadAllClients();

  // Per-group counts — drives the badges on the tab bar regardless of
  // which tab is currently active or whether a search filter is applied.
  const counts = { current: 0, won: 0, past: 0, unsorted: 0 };
  clients.forEach(c => { counts[c.group] = (counts[c.group] || 0) + 1; });
  GROUP_KEYS.forEach(g => {
    const el = document.querySelector('[data-count="' + g + '"]');
    if (el) el.textContent = counts[g] || 0;
  });

  // Hide the Unsorted tab when it's empty (it'll reappear automatically
  // the moment any client lands back in unsorted). The other three are
  // always visible — even at zero — because they're permanent buckets.
  const unsortedTab = document.querySelector('#groupTabs .group-tab[data-group="unsorted"]');
  if (unsortedTab) unsortedTab.classList.toggle('hidden', counts.unsorted === 0);

  // Only bounce the user off their current tab if the tab is about to
  // VANISH from the strip (Unsorted hides itself when empty). Every
  // other tab is a permanent bucket, so leave the user on it even if
  // empty — that way recategorising a client doesn't yank them off
  // the view they were working in.
  if (_activeTab === 'unsorted' && counts.unsorted === 0) {
    _setActiveTab('current');
  }

  // Filter by active tab first, then by search query
  const inTab = clients.filter(c => c.group === _activeTab);
  const q = _searchQuery.trim().toLowerCase();
  const filtered = q
    ? inTab.filter(c =>
        c.name.toLowerCase().includes(q) ||
        (c.notes || "").toLowerCase().includes(q))
    : inTab;

  document.getElementById('rowCount').textContent =
    filtered.length + " client" + (filtered.length !== 1 ? "s" : "") +
    " in " + (GROUP_LABELS[_activeTab] || _activeTab) +
    (q ? " (filtered)" : "");

  const grid = document.getElementById('grid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state">' +
      (clients.length === 0
        ? 'No clients yet.<div class="hint">Add a Status Report task with a client name and it\'ll appear here.</div>'
        : q
          ? 'No matches for "' + escH(_searchQuery) + '" in ' + escH(GROUP_LABELS[_activeTab]) + '.'
          : 'No clients in ' + escH(GROUP_LABELS[_activeTab]) + ' yet.<div class="hint">Open a client from another tab and change its group, or wait for new Status Report clients to land in Unsorted.</div>') +
      '</div>';
    return;
  }

  grid.innerHTML = filtered.map(c => {
    const hasNotes = !!c.notes.trim();
    const previewText = hasNotes
      ? escH(c.notes.trim()).slice(0, 300)
      : 'No notes yet — click to add.';
    const badge = '<span class="group-badge ' + c.group + '">' + escH(GROUP_LABELS[c.group] || c.group) + '</span>';
    const enc = encodeURIComponent(c.name);
    return '<div class="client-card' + (hasNotes ? ' has-notes' : '') + '" ' +
           'draggable="true" ' +
           'data-client="' + enc + '" ' +
           'ondragstart="_onCardDragStart(event)" ' +
           'ondragend="_onCardDragEnd(event)" ' +
           'onclick="openClientNotesModal(\'' + enc + '\')">' +
             '<div class="client-card-header">' +
               '<div class="client-name">' + escH(c.name) + '</div>' +
               '<a class="client-card-convo" href="conversations.html?client=' + enc + '" ' +
                  'onclick="event.stopPropagation()" ' +
                  'title="Email conversations with ' + escH(c.name) + '">📬</a>' +
               '<div class="client-task-count">' +
                 (c.count > 0 ? c.count + ' task' + (c.count !== 1 ? 's' : '') : 'notes only') +
               '</div>' +
             '</div>' +
             '<div class="client-notes-preview' + (hasNotes ? '' : ' empty') + '">' + previewText + '</div>' +
             '<div class="client-meta">' + badge + '</div>' +
           '</div>';
  }).join('');
}

/* ════════════════════════════════════════════════════════════
   DRAG-AND-DROP: drag a client card onto a tab to re-categorize.
   Touch devices can use the modal's Group picker instead — HTML5
   native DnD doesn't fire on iOS Safari without a polyfill.
   ════════════════════════════════════════════════════════════ */
let _draggingClient = null;

function _onCardDragStart(e) {
  const card = e.currentTarget;
  _draggingClient = decodeURIComponent(card.dataset.client || '');
  card.classList.add('dragging');
  try {
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', _draggingClient);
  } catch (_) {}
}

function _onCardDragEnd(e) {
  const card = e.currentTarget;
  card.classList.remove('dragging');
  document.querySelectorAll('#groupTabs .group-tab').forEach(t => t.classList.remove('drag-over'));
  _draggingClient = null;
}

// Tab drag-over / drag-leave / drop handlers — attach once via
// delegation on the tab strip.
document.getElementById('groupTabs').addEventListener('dragover', function (e) {
  const btn = e.target.closest('.group-tab');
  if (!btn || !_draggingClient) return;
  e.preventDefault();
  try { e.dataTransfer.dropEffect = 'move'; } catch (_) {}
  btn.classList.add('drag-over');
});
document.getElementById('groupTabs').addEventListener('dragleave', function (e) {
  const btn = e.target.closest('.group-tab');
  if (btn) btn.classList.remove('drag-over');
});
document.getElementById('groupTabs').addEventListener('drop', function (e) {
  const btn = e.target.closest('.group-tab');
  if (!btn) return;
  e.preventDefault();
  btn.classList.remove('drag-over');
  const targetGroup = btn.dataset.group;
  const clientName = _draggingClient;
  if (!clientName || GROUP_KEYS.indexOf(targetGroup) < 0) return;
  setClientGroup(clientName, targetGroup);
  // Stay on the current tab — recategorising shouldn't yank the user
  // away from what they were looking at. The card simply disappears
  // from this filtered view; the destination tab's count badge ticks
  // up so they can see it landed correctly.
  render();
});

function openClientNotesModal(encodedClient) {
  const clientName = decodeURIComponent(encodedClient);
  if (!clientName) return;
  _editingClient = clientName;
  _editingGroup = getClientGroup(clientName);
  document.getElementById('clientNotesTitle').textContent = clientName;
  document.getElementById('clientNotesTextarea').value = getClientNotes(clientName);
  _paintGroupPicker();
  document.getElementById('clientNotesModal').classList.add('open');
  setTimeout(() => {
    try { document.getElementById('clientNotesTextarea').focus(); } catch (e) {}
  }, 30);
}

function _paintGroupPicker() {
  document.querySelectorAll('#modalGroupPicker .group-pick').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.group === _editingGroup);
  });
}

function closeClientNotesModal() {
  document.getElementById('clientNotesModal').classList.remove('open');
  _editingClient = null;
}

function saveClientNotes() {
  if (!_editingClient) return;
  const text = document.getElementById('clientNotesTextarea').value;
  const all = loadAllClientNotes();
  if (text.trim()) all[_editingClient] = text;
  else delete all[_editingClient];
  saveAllClientNotes(all);
  setClientGroup(_editingClient, _editingGroup);
  // Saving = explicit interaction, so un-hide if they had previously
  // deleted this card. They obviously want it back.
  setClientHidden(_editingClient, false);
  // Intentionally NOT switching tabs here — the user is editing notes,
  // not navigating. Recategorising should leave them exactly where
  // they were; the card simply disappears from this filtered view.
  closeClientNotesModal();
  render();
}

function clearClientNotes() {
  if (!_editingClient) return;
  if (!confirm(
    'Remove "' + _editingClient + '" from the Client Notes page?\n\n' +
    'The card and its notes will disappear from here. The Status ' +
    'Report task for this client is NOT touched. To bring the card ' +
    'back later, open the same client from the 📝 icon on the ' +
    'Status Report and Save.'
  )) return;
  // Delete the note text AND the group assignment, AND add the client
  // to the hidden list so the card stops appearing in the grid. The
  // SR task itself is untouched — sr_tasks / sr_archived_tasks are
  // never written to from here.
  const all = loadAllClientNotes();
  delete all[_editingClient];
  saveAllClientNotes(all);
  const groups = loadAllClientGroups();
  delete groups[_editingClient];
  saveAllClientGroups(groups);
  setClientHidden(_editingClient, true);
  closeClientNotesModal();
  render();
}

function _setActiveTab(group) {
  if (GROUP_KEYS.indexOf(group) < 0) group = 'current';
  _activeTab = group;
  try { localStorage.setItem('cn_active_tab', group); } catch (e) {}
  document.querySelectorAll('#groupTabs .group-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.group === group);
  });
}

// Tab clicks
document.getElementById('groupTabs').addEventListener('click', function (e) {
  const btn = e.target.closest('.group-tab');
  if (!btn) return;
  _setActiveTab(btn.dataset.group);
  render();
});

// Modal group-picker clicks
document.getElementById('modalGroupPicker').addEventListener('click', function (e) {
  const btn = e.target.closest('.group-pick');
  if (!btn) return;
  _editingGroup = btn.dataset.group;
  _paintGroupPicker();
});

// Search
document.getElementById('searchInput').addEventListener('input', function (e) {
  _searchQuery = e.target.value || "";
  render();
});

// Cmd+S / Ctrl+S inside the modal saves
document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 's' &&
      document.getElementById('clientNotesModal').classList.contains('open')) {
    e.preventDefault();
    saveClientNotes();
  }
  if (e.key === 'Escape' &&
      document.getElementById('clientNotesModal').classList.contains('open')) {
    closeClientNotesModal();
  }
});

// Expose for inline handlers
window.openClientNotesModal = openClientNotesModal;
window.closeClientNotesModal = closeClientNotesModal;
window.saveClientNotes = saveClientNotes;
window.clearClientNotes = clearClientNotes;
window._onCardDragStart = _onCardDragStart;
window._onCardDragEnd = _onCardDragEnd;

// Initial tab highlight (in case the persisted tab isn't 'current')
_setActiveTab(_activeTab);

/* Cloud-sync refresh hook — same pattern as the other pages */
window.reloadStateFromLocalStorage = function () {
  /* nothing in-memory to refresh here; render() reads from localStorage */
};
window.reloadFromLocalStorage = function () {
  render();
};

render();
</script>

</body>
</html>
