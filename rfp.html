<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TJA RFP Inbox</title>
<script type="module" src="firebase-sync.js?v=27"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
html { font-size: 120%; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #161616; color: #ececec; min-height: 100vh; padding-left: 190px; }

/* ─── SIDEBAR NAV (global — brand stripe on the left edge) ─── */
.nav { position: fixed; top: 0; left: 0; bottom: 0; width: 190px; z-index: 5000; background: #0a0a0a; display: flex; flex-direction: column; align-items: stretch; gap: 0; border-left: 3px solid #FF7800; border-right: 1px solid #1c1c1c; box-shadow: 4px 0 20px rgba(0,0,0,0.4); overflow-y: auto; }
.nav a { position: relative; padding: 0.62rem 1.05rem; display: flex; align-items: center; text-decoration: none; color: #888; font-size: 0.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.13em; transition: color 0.2s ease, background 0.2s ease; }
.nav a::before { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: transparent; margin-right: 9px; flex-shrink: 0; transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease; }
.nav a:hover { color: #fff; background: rgba(255,255,255,0.025); }
.nav a.active { color: #FF7800; background: rgba(255,120,0,0.07); }
.nav a.active::before { background: #FF7800; box-shadow: 0 0 12px rgba(255,120,0,0.85); transform: scale(1.15); }
.nav-logo { height: 28px; margin: 16px auto 14px; flex-shrink: 0; opacity: 0.95; align-self: center; }
.nav-date { margin-top: auto; padding: 0.8rem 1.05rem 0.35rem; font-size: 0.6rem; font-weight: 400; color: #888; letter-spacing: 0.01em; }
.auth-bar { padding: 0.3rem 1.05rem 1rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; min-height: 32px; }
.auth-status { font-size: 0.58rem; color: #9a9a9a; letter-spacing: 0.02em; word-break: break-word; }
.auth-status-local { color: #f6ad55; }
.auth-btn { padding: 0.32rem 0.75rem; font-size: 0.6rem; border: 1px solid #3a3a3a; background: transparent; color: #c4c4c4; border-radius: 5px; cursor: pointer; font-family: inherit; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; transition: all 0.15s ease; }
.auth-btn:hover { background: #1f1f1f; color: #fff; border-color: #5a5a5a; }
.auth-btn.auth-btn-primary { background: #FF7800; color: #000; border-color: #FF7800; font-weight: 700; }
.auth-btn.auth-btn-primary:hover { background: #ff9533; border-color: #ff9533; color: #000; }
@media (max-width: 720px) {
  body { padding-left: 0; }
  .nav { position: sticky; top: 0; bottom: auto; width: 100%; height: auto; flex-direction: row; align-items: center; overflow-x: auto; overflow-y: hidden; border-left: none; border-right: none; border-top: 3px solid #FF7800; border-bottom: 1px solid #1c1c1c; }
  .nav a { padding: 0.5rem 0.55rem; font-size: 0.55rem; letter-spacing: 0.1em; white-space: nowrap; }
  .nav-logo { height: 24px; margin: 0 8px 0 10px; }
  .nav-date { display: none; }
  .auth-bar { margin-left: auto; padding: 0.3rem 0.6rem; flex-wrap: nowrap; min-height: 0; }
}

/* ─── RFP PAGE ─── */
.page-head { padding: 1.1rem 1.5rem 0.4rem; }
.page-head h1 { font-size: 1.05rem; font-weight: 900; letter-spacing: 0.02em; }
.page-head .sub { color: #888; font-size: 0.68rem; margin-top: 0.15rem; }
.stats { display: flex; gap: 1.3rem; padding: 0.6rem 1.5rem 0.2rem; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; }
.stat .n { font-size: 1.25rem; font-weight: 800; }
.stat .l { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.1em; color: #888; }
.stat .n.accent { color: #FF7800; }
.src-note { padding: 0.2rem 1.5rem 0; font-size: 0.62rem; color: #6b6b6b; }
.src-note b { color: #f6ad55; }
.toolbar { padding: 0.7rem 1.5rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #2a2a2a; }
.toolbar input[type=text], .toolbar select { background: #1f1f1f; border: 1px solid #2a2a2a; color: #ececec; padding: 0.4rem 0.7rem; border-radius: 6px; font-size: 0.72rem; outline: none; font-family: inherit; }
.toolbar input[type=text] { width: 220px; }
.toolbar input:focus, .toolbar select:focus { border-color: #FF7800; }
.toolbar .grow { flex: 1; }
.chips { display: flex; gap: 0.35rem; flex-wrap: wrap; }
.chip { padding: 0.3rem 0.7rem; font-size: 0.6rem; border: 1px solid #2a2a2a; border-radius: 20px; cursor: pointer; color: #bbb; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.chip.active { background: rgba(255,120,0,0.12); color: #FF7800; border-color: rgba(255,120,0,0.45); }

.list { padding: 0.8rem 1.5rem 3rem; display: flex; flex-direction: column; gap: 0.6rem; }
.rfp { background: #1c1c1c; border: 1px solid #2a2a2a; border-left: 3px solid #3a3a3a; border-radius: 9px; padding: 0.85rem 1rem; display: grid; grid-template-columns: 1fr auto; gap: 0.4rem 1rem; }
.rfp.tier-pursue { border-left-color: #48bb78; }
.rfp.tier-qualify { border-left-color: #FF7800; }
.rfp.tier-pass { border-left-color: #fc8181; }
.rfp.new { box-shadow: 0 0 0 1px rgba(255,120,0,0.25); }
.rfp .title { font-size: 0.85rem; font-weight: 700; }
.rfp .meta { font-size: 0.66rem; color: #999; margin-top: 0.15rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }
.rfp .meta b { color: #cfcfcf; font-weight: 600; }
.rfp .summary { grid-column: 1 / -1; font-size: 0.7rem; color: #b5b5b5; line-height: 1.45; margin-top: 0.25rem; }
.rfp .right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; }
.badge { font-size: 0.55rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.2rem 0.5rem; border-radius: 5px; border: 1px solid; white-space: nowrap; }
.badge.pending { color: #9a9a9a; border-color: #3a3a3a; background: #1f1f1f; }
.badge.pursue { color: #48bb78; border-color: rgba(72,187,120,0.45); background: rgba(72,187,120,0.12); }
.badge.qualify { color: #FF7800; border-color: rgba(255,120,0,0.45); background: rgba(255,120,0,0.12); }
.badge.pass { color: #fc8181; border-color: rgba(252,129,129,0.4); background: rgba(252,129,129,0.1); }
.due { font-size: 0.62rem; font-weight: 700; }
.due.soon { color: #fc8181; }
.due.ok { color: #9a9a9a; }
.actions { grid-column: 1 / -1; display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem; flex-wrap: wrap; }
.actions select { background: #1f1f1f; border: 1px solid #2a2a2a; color: #ececec; padding: 0.3rem 0.55rem; border-radius: 6px; font-size: 0.65rem; font-family: inherit; }
.actions .link-btn, .actions .mini { padding: 0.32rem 0.7rem; font-size: 0.6rem; border-radius: 6px; border: 1px solid #3a3a3a; background: transparent; color: #cfcfcf; cursor: pointer; text-decoration: none; font-weight: 600; letter-spacing: 0.03em; }
.actions .link-btn:hover, .actions .mini:hover { border-color: #FF7800; color: #FF7800; }
.actions .notes { flex: 1; min-width: 160px; background: #1f1f1f; border: 1px solid #2a2a2a; color: #ececec; padding: 0.32rem 0.6rem; border-radius: 6px; font-size: 0.65rem; font-family: inherit; }
.actions .mirrored { font-size: 0.58rem; color: #48bb78; }
.status-tag { font-size: 0.55rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
.status-new { color: #FF7800; } .status-reviewing { color: #f6ad55; } .status-pursue { color: #48bb78; } .status-passed { color: #888; }
.empty { padding: 3rem 1.5rem; text-align: center; color: #888; }
</style>
</head>
<body>
<nav class="nav">
  <img class="nav-logo" src="https://thejamesagency.com/wp-content/uploads/2025/04/TJA-primary-logo.svg" alt="TJA">
  <a href="task-list.html">Status Report</a>
  <a href="weekly-priorities.html">Weekly Priorities</a>
  <a href="client-notes.html">Client Notes</a>
  <a href="scorecard.html">Scorecard</a>
  <a href="rfp.html" class="active">RFPs</a>
  <a href="outreach.html">Outreach</a>
  <a href="conversations.html">Conversations</a>
  <a href="projects.html">Projects</a>
  <a href="forecast.html">Forecast</a>
  <div class="nav-date" id="headerDate"></div>
  <div class="auth-bar" id="authBar"></div>
</nav>

<div class="page-head">
  <h1>RFP Inbox</h1>
  <div class="sub">Incoming opportunities from BidPrime — triage, deep-link, and auto-mirror to the Scorecard.</div>
</div>
<div class="stats" id="stats"></div>
<div class="src-note" id="srcNote"></div>
<div class="toolbar">
  <div class="search-wrap"><input type="text" id="q" placeholder="Search title / agency…"></div>
  <div class="chips" id="tierChips"></div>
  <select id="agencyFilter"><option value="">All agencies</option></select>
  <select id="statusFilter">
    <option value="">All statuses</option>
    <option value="new">New</option>
    <option value="reviewing">Reviewing</option>
    <option value="pursue">Pursue</option>
    <option value="passed">Passed</option>
  </select>
  <span class="grow"></span>
  <select id="sortBy">
    <option value="due">Sort: Due date</option>
    <option value="received">Sort: Newest</option>
    <option value="score">Sort: Score</option>
  </select>
</div>
<div class="list" id="list"></div>

<script>
/* ─── CONFIG ─── */
// Leave blank to run on bundled sample RFPs. After the Supabase backend is
// deployed, paste the project URL + anon key here (both are public / safe to
// commit — RLS makes the table select-only).
var SUPABASE = { url: '', anonKey: '' };

var TRIAGE_KEY = 'rfp_triage';   // synced via firebase-sync (v27): { [rfpId]: {status, notes, mirroredAt} }
var SC_KEY = 'scorecards';       // shared with the Scorecard page

var STATUS_LABELS = { new: 'New', reviewing: 'Reviewing', pursue: 'Pursue', passed: 'Passed' };
var uiState = { q: '', tier: '', agency: '', status: '', sort: 'due' };

/* ─── SAMPLE DATA (mirrors the Edge-function sample so the page works offline) ─── */
function sampleRfps() {
  var iso = function (d) { return new Date(Date.now() + d * 864e5).toISOString(); };
  return [
    { external_id: 'SAMPLE-001', title: 'Statewide Tourism Brand Campaign — Creative & Media', agency: 'Arizona Office of Tourism', category: 'Advertising / Media', source_url: 'https://www.bidprime.com/', posted_at: iso(-2), due_at: iso(18), summary: 'Full-service creative, paid media planning/buying, and analytics for a statewide tourism campaign. Estimated annual budget $1.2M.', score: null },
    { external_id: 'SAMPLE-002', title: 'Website Redesign & CMS Migration', agency: 'City of Chandler', category: 'Web / Digital', source_url: 'https://www.bidprime.com/', posted_at: iso(-1), due_at: iso(9), summary: "Redesign of the city's public website, accessibility remediation (WCAG 2.1 AA), and migration to a modern CMS.", score: null },
    { external_id: 'SAMPLE-003', title: 'Public Awareness Campaign — Water Conservation', agency: 'Salt River Project', category: 'Public Relations', source_url: 'https://www.bidprime.com/', posted_at: iso(-3), due_at: iso(25), summary: 'Integrated PR + social campaign to drive residential water-conservation behavior across the metro area.', score: null },
    { external_id: 'SAMPLE-004', title: 'Photography & Video Production — Annual Report', agency: 'Maricopa County', category: 'Photo / Video', source_url: 'https://www.bidprime.com/', posted_at: iso(-5), due_at: iso(4), summary: "Photo and video production services for the county's annual report and ongoing communications.", score: null },
    { external_id: 'SAMPLE-005', title: 'Social Media Management — 12 month retainer', agency: 'Arizona Department of Health Services', category: 'Social / Retainer', source_url: 'https://www.bidprime.com/', posted_at: iso(-1), due_at: iso(30), summary: 'Ongoing social media strategy, content, and community management retainer for a state health agency.', score: null }
  ];
}

/* ─── HELPERS ─── */
function escH(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function escA(s) { return escH(s).replace(/'/g, '&#39;'); }
function isAdmin() {
  var el = document.getElementById('authBar');
  var t = el ? el.textContent : '';
  if (/View only|Local only/i.test(t)) return false;
  if (/Synced/i.test(t)) return true;
  return false;
}
function loadTriage() { try { return JSON.parse(localStorage.getItem(TRIAGE_KEY) || '{}') || {}; } catch (e) { return {}; } }
function saveTriage(o) { try { localStorage.setItem(TRIAGE_KEY, JSON.stringify(o)); } catch (e) {} }
function tierOf(rfp) { return (rfp.score && rfp.score.tier ? String(rfp.score.tier) : '').toLowerCase() || 'pending'; }
function tierClass(t) { return t === 'pursue' ? 'pursue' : (t === 'qualify' ? 'qualify' : (t === 'pass' ? 'pass' : 'pending')); }
function daysUntil(iso) { if (!iso) return null; return Math.ceil((new Date(iso).getTime() - Date.now()) / 864e5); }
function isNewToday(iso) { if (!iso) return false; var d = new Date(iso); var n = new Date(); return d.toDateString() === n.toDateString(); }

/* ─── DATA ─── */
var RFPS = [];
function configured() { return SUPABASE.url && SUPABASE.anonKey; }
function fetchRfps() {
  if (!configured()) return Promise.resolve(sampleRfps());
  var url = SUPABASE.url.replace(/\/$/, '') + '/rest/v1/rfps?select=*&order=received_at.desc';
  return fetch(url, { headers: { apikey: SUPABASE.anonKey, Authorization: 'Bearer ' + SUPABASE.anonKey } })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .catch(function (e) { console.warn('[rfp] Supabase fetch failed, using samples', e); return sampleRfps(); });
}

/* ─── SCORECARD MIRROR (guarded — never clobbers a hand-scored record) ─── */
function mirrorToScorecard(rfp, triage) {
  if (!isAdmin()) return;                       // only the writer mirrors
  var key = String(rfp.title || rfp.agency || rfp.external_id).trim();
  if (!key) return;
  var sc = {};
  try { sc = JSON.parse(localStorage.getItem(SC_KEY) || '{}') || {}; } catch (e) { sc = {}; }
  var existing = sc[key];
  // Merge guard: never overwrite a record a human has scored or overridden.
  if (existing && (existing.humanInputAt || existing.override)) return;
  // Dedup: only write once per RFP unless it hasn't been mirrored yet.
  if (triage.mirroredAt && existing) return;
  var ctxParts = [];
  if (rfp.agency) ctxParts.push('Agency: ' + rfp.agency);
  if (rfp.category) ctxParts.push('Category: ' + rfp.category);
  if (rfp.due_at) ctxParts.push('Response due: ' + new Date(rfp.due_at).toLocaleDateString());
  if (rfp.source_url) ctxParts.push('Source: ' + rfp.source_url);
  if (rfp.summary) ctxParts.push('\n' + rfp.summary);
  sc[key] = Object.assign({}, existing, {
    client: key,
    type: 'rfp',
    source: 'bidprime',
    rfpId: rfp.external_id || null,
    sourceUrl: rfp.source_url || null,
    agency: rfp.agency || null,
    category: rfp.category || null,
    dueAt: rfp.due_at || null,
    discretionaryRead: ctxParts.join('\n'),
    investment: (existing && existing.investment) || { scores: {} },
    createdAt: (existing && existing.createdAt) || new Date().toISOString(),
    _rfpMirror: true
  });
  try { localStorage.setItem(SC_KEY, JSON.stringify(sc)); } catch (e) {}
  triage.mirroredAt = new Date().toISOString();
}

/* ─── RENDER ─── */
function render() {
  var triage = loadTriage();
  // populate agency filter
  var agencies = {}; RFPS.forEach(function (r) { if (r.agency) agencies[r.agency] = 1; });
  var af = document.getElementById('agencyFilter');
  if (af.options.length <= 1) {
    Object.keys(agencies).sort().forEach(function (a) { var o = document.createElement('option'); o.value = a; o.textContent = a; af.appendChild(o); });
  }
  // tier chips
  var tiers = [['', 'All'], ['pursue', 'Pursue'], ['qualify', 'Qualify'], ['pass', 'Pass'], ['pending', 'Pending']];
  document.getElementById('tierChips').innerHTML = tiers.map(function (t) {
    return '<span class="chip ' + (uiState.tier === t[0] ? 'active' : '') + '" data-tier="' + t[0] + '">' + t[1] + '</span>';
  }).join('');

  // filter
  var q = uiState.q.toLowerCase();
  var rows = RFPS.filter(function (r) {
    var tg = triage[r.external_id] || {};
    if (q && (String(r.title) + ' ' + String(r.agency)).toLowerCase().indexOf(q) === -1) return false;
    if (uiState.tier && tierOf(r) !== uiState.tier) return false;
    if (uiState.agency && r.agency !== uiState.agency) return false;
    if (uiState.status && (tg.status || 'new') !== uiState.status) return false;
    return true;
  });
  // sort
  rows.sort(function (a, b) {
    if (uiState.sort === 'received') return new Date(b.posted_at || 0) - new Date(a.posted_at || 0);
    if (uiState.sort === 'score') { var sa = (a.score && a.score.total) || 0, sb = (b.score && b.score.total) || 0; return sb - sa; }
    var da = daysUntil(a.due_at), db = daysUntil(b.due_at);
    if (da == null) return 1; if (db == null) return -1; return da - db;
  });

  // stats
  var newToday = RFPS.filter(function (r) { return isNewToday(r.posted_at); }).length;
  var pursue = RFPS.filter(function (r) { return tierOf(r) === 'pursue'; }).length;
  var pending = RFPS.filter(function (r) { return tierOf(r) === 'pending'; }).length;
  document.getElementById('stats').innerHTML =
    '<div class="stat"><span class="n">' + RFPS.length + '</span><span class="l">In pipeline</span></div>' +
    '<div class="stat"><span class="n accent">' + newToday + '</span><span class="l">New today</span></div>' +
    '<div class="stat"><span class="n">' + pursue + '</span><span class="l">Pursue tier</span></div>' +
    '<div class="stat"><span class="n">' + pending + '</span><span class="l">Awaiting score</span></div>';
  document.getElementById('srcNote').innerHTML = configured()
    ? 'Live feed via Supabase.'
    : '<b>Sample data.</b> Showing bundled example RFPs — paste the Supabase URL + anon key into rfp.html (and deploy the backend) to go live.';

  // list
  var host = document.getElementById('list');
  if (!rows.length) { host.innerHTML = '<div class="empty">No RFPs match the current filters.</div>'; return; }
  host.innerHTML = rows.map(function (r) {
    var tg = triage[r.external_id] || {};
    var t = tierOf(r), tc = tierClass(t);
    var du = daysUntil(r.due_at);
    var dueTxt = du == null ? 'No due date' : (du < 0 ? 'Closed' : du + ' day' + (du === 1 ? '' : 's') + ' left');
    var status = tg.status || 'new';
    return '<div class="rfp tier-' + tc + (isNewToday(r.posted_at) ? ' new' : '') + '">' +
      '<div><div class="title">' + escH(r.title) + '</div>' +
        '<div class="meta"><span><b>' + escH(r.agency || '—') + '</b></span>' +
          (r.category ? '<span>' + escH(r.category) + '</span>' : '') +
          '<span class="status-tag status-' + status + '">' + STATUS_LABELS[status] + '</span></div></div>' +
      '<div class="right"><span class="badge ' + tc + '">' + (t === 'pending' ? 'Awaiting score' : t) + '</span>' +
        '<span class="due ' + (du != null && du <= 7 ? 'soon' : 'ok') + '">' + escH(dueTxt) + '</span></div>' +
      (r.summary ? '<div class="summary">' + escH(r.summary) + '</div>' : '') +
      '<div class="actions">' +
        '<select data-id="' + escA(r.external_id) + '" data-act="status">' +
          Object.keys(STATUS_LABELS).map(function (k) { return '<option value="' + k + '"' + (status === k ? ' selected' : '') + '>' + STATUS_LABELS[k] + '</option>'; }).join('') +
        '</select>' +
        (r.source_url ? '<a class="link-btn" href="' + escA(r.source_url) + '" target="_blank" rel="noopener">Open in BidPrime ↗</a>' : '') +
        '<input class="notes" data-id="' + escA(r.external_id) + '" data-act="notes" placeholder="Triage notes…" value="' + escA(tg.notes || '') + '">' +
        (tg.mirroredAt ? '<span class="mirrored">✓ on Scorecard</span>' : '<button class="mini" data-id="' + escA(r.external_id) + '" data-act="mirror">+ Scorecard</button>') +
      '</div>' +
    '</div>';
  }).join('');

  host.querySelectorAll('[data-act="status"]').forEach(function (el) {
    el.addEventListener('change', function () { updateTriage(this.dataset.id, { status: this.value }); });
  });
  host.querySelectorAll('[data-act="notes"]').forEach(function (el) {
    el.addEventListener('change', function () { updateTriage(this.dataset.id, { notes: this.value }); });
  });
  host.querySelectorAll('[data-act="mirror"]').forEach(function (el) {
    el.addEventListener('click', function () {
      var r = RFPS.filter(function (x) { return String(x.external_id) === this.dataset.id; }.bind(this))[0];
      if (!r) return;
      var tri = loadTriage(); var tg = tri[r.external_id] || (tri[r.external_id] = {});
      mirrorToScorecard(r, tg); saveTriage(tri); render();
    });
  });
}

function updateTriage(id, patch) {
  if (!isAdmin()) { if (window.toast) window.toast('Sign in as Cameron to edit'); render(); return; }
  var tri = loadTriage();
  tri[id] = Object.assign({}, tri[id], patch);
  saveTriage(tri);
}

/* auto-mirror pass — mirror any un-mirrored RFP once (admin only) */
function autoMirror() {
  if (!isAdmin()) return;
  var tri = loadTriage(); var changed = false;
  RFPS.forEach(function (r) {
    var tg = tri[r.external_id] || (tri[r.external_id] = {});
    if (!tg.mirroredAt) { mirrorToScorecard(r, tg); changed = true; }
  });
  if (changed) saveTriage(tri);
}

/* ─── EVENTS ─── */
document.getElementById('q').addEventListener('input', function () { uiState.q = this.value; render(); });
document.getElementById('agencyFilter').addEventListener('change', function () { uiState.agency = this.value; render(); });
document.getElementById('statusFilter').addEventListener('change', function () { uiState.status = this.value; render(); });
document.getElementById('sortBy').addEventListener('change', function () { uiState.sort = this.value; render(); });
document.getElementById('tierChips').addEventListener('click', function (e) {
  var c = e.target.closest('[data-tier]'); if (!c) return; uiState.tier = c.dataset.tier; render();
});

// header date
(function () { var el = document.getElementById('headerDate'); if (el) el.textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }); })();

// firebase-sync calls window.render after a cloud snapshot arrives
window.render = render;
window.addEventListener('storage', function (e) { if (e.key === TRIAGE_KEY) render(); });

// boot
fetchRfps().then(function (list) {
  RFPS = (list || []).map(function (r) { return r; });
  render();
  // give auth a moment to resolve, then auto-mirror once
  var tries = 0; var iv = setInterval(function () { tries++; if (isAdmin()) { autoMirror(); render(); clearInterval(iv); } if (tries > 20) clearInterval(iv); }, 500);
});
</script>
</body>
</html>
